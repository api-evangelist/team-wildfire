name: Team Wildfire
description: Team Wildfire develops jet engine-enabled fire suppression technology
  built to prevent catastrophic wildfire losses. Its mobile units, the "Hurricane"
  and "Storm Cell", apply fire retardant at scale to deny ground to advancing
  wildfires. The company offers fireground services, evacuation route hardening,
  asset protection, prescribed fire containment, and military base protection. Team
  Wildfire is a physical hardware and services company backed by Techstars; it
  publishes a marketing and services website but no public API, developer portal,
  SDKs, or developer documentation. This API Evangelist profile was surfaced as a
  Techstars portfolio lead and enriched with the identity and domain-security
  signals available for a non-API company.
